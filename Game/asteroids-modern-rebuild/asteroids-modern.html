<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="description" content="以原生 Canvas、CSS 與 JavaScript 重製的經典小行星射擊遊戲。" />
  <title>ASTR // 79 — Vector Arcade Remake</title>
  <style>
    /* Design anchor: CRT vector arcade revival — near-black space, mint phosphor, amber thrust. */
    :root { --ink:#060b12; --mint:#a5ffd6; --mist:#e9fff5; --amber:#ffc857; --coral:#ff5d73; --panel:rgba(8,17,29,.86); --line:rgba(165,255,214,.27); }
    * { box-sizing:border-box; }
    html,body { min-height:100%; margin:0; background:var(--ink); color:var(--mist); font-family:"Courier New",Courier,monospace; }
    body { overflow:hidden; letter-spacing:.055em; }
    button { font:inherit; letter-spacing:inherit; }
    .shell { min-height:100svh; display:grid; place-items:center; padding:clamp(12px,2.4vw,34px); background:radial-gradient(circle at 50% 8%,#102031 0%,#07111c 38%,#02060b 100%); }
    .console { width:min(1200px,100%); position:relative; border:1px solid var(--line); background:linear-gradient(120deg,rgba(8,19,30,.97),rgba(2,7,12,.99)); box-shadow:0 24px 80px rgba(0,0,0,.62),inset 0 0 70px rgba(92,255,191,.025); overflow:hidden; }
    .console::before { content:""; pointer-events:none; z-index:6; position:absolute; inset:0; opacity:.25; background:repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 1px,transparent 1px 4px),radial-gradient(ellipse at center,transparent 46%,rgba(0,0,0,.42) 100%); mix-blend-mode:soft-light; }
    .deck { min-height:64px; display:flex; align-items:center; justify-content:space-between; gap:18px; padding:14px clamp(16px,2.4vw,30px); border-bottom:1px solid var(--line); background:rgba(3,10,17,.78); }
    .brand { display:flex; align-items:center; gap:13px; min-width:0; }
    .mark { width:42px; height:42px; padding:4px; object-fit:contain; background:#07131d; border:1px solid rgba(165,255,214,.46); filter:grayscale(1) sepia(1) saturate(6) hue-rotate(96deg) brightness(1.52) drop-shadow(0 0 8px rgba(165,255,214,.5)); }
    .wordmark { color:var(--mint); font-size:clamp(14px,1.8vw,20px); font-weight:bold; white-space:nowrap; text-shadow:0 0 15px rgba(165,255,214,.34); }
    .submark { margin-top:2px; color:rgba(233,255,245,.62); font-size:9px; letter-spacing:.18em; white-space:nowrap; }
    .status { display:flex; align-items:center; gap:13px; color:rgba(233,255,245,.65); font-size:10px; text-align:right; }
    .signal { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--mint); box-shadow:0 0 13px var(--mint); animation:pulse 1.8s ease-in-out infinite; }
    .viewport { position:relative; aspect-ratio:16/9; min-height:300px; background:#060b12; overflow:hidden; }
    canvas { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
    .corner { position:absolute; z-index:4; width:20px; height:20px; pointer-events:none; border-color:var(--mint); opacity:.72; }
    .corner.tl { top:12px; left:12px; border-top:1px solid; border-left:1px solid; } .corner.tr { top:12px; right:12px; border-top:1px solid; border-right:1px solid; }
    .corner.bl { bottom:12px; left:12px; border-bottom:1px solid; border-left:1px solid; } .corner.br { bottom:12px; right:12px; border-bottom:1px solid; border-right:1px solid; }
    .overlay { position:absolute; z-index:5; inset:0; display:grid; place-items:center; padding:24px; background:radial-gradient(ellipse at center,rgba(6,15,24,.3),rgba(1,5,9,.72)); transition:opacity .18s cubic-bezier(.23,1,.32,1),visibility .18s; }
    .overlay.hidden { opacity:0; visibility:hidden; pointer-events:none; }
    .card { width:min(480px,100%); border:1px solid rgba(165,255,214,.42); background:linear-gradient(135deg,rgba(7,18,29,.94),rgba(4,10,17,.82)); padding:clamp(21px,4vw,42px); text-align:center; box-shadow:0 0 50px rgba(0,0,0,.42),inset 0 0 24px rgba(165,255,214,.035); }
    .eyebrow { color:var(--amber); font-size:10px; letter-spacing:.24em; margin-bottom:13px; }
    .title { margin:0; font-size:clamp(30px,6vw,62px); color:var(--mint); line-height:.91; letter-spacing:.08em; text-shadow:0 0 24px rgba(165,255,214,.4); }
    .rule { height:1px; background:linear-gradient(90deg,transparent,var(--mint),transparent); margin:24px auto 17px; }
    .prompt { margin:0; color:var(--mist); font-size:clamp(11px,1.5vw,14px); line-height:1.8; }
    .start { margin-top:25px; padding:12px 18px; color:var(--ink); background:var(--mint); border:1px solid var(--mint); font-weight:bold; cursor:pointer; box-shadow:0 0 20px rgba(165,255,214,.18); transition:transform .14s cubic-bezier(.23,1,.32,1),box-shadow .14s; }
    .start:hover,.start:focus-visible { transform:translateY(-2px); box-shadow:0 0 28px rgba(165,255,214,.42); outline:none; }
    .start:active { transform:scale(.97); }
    .footer { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px clamp(16px,2.4vw,30px); background:rgba(2,8,14,.73); border-top:1px solid var(--line); color:rgba(233,255,245,.7); font-size:10px; line-height:1.5; }
    .footer strong { color:var(--mint); font-weight:normal; }
    .help { flex:0 0 auto; padding:7px 10px; color:var(--mint); background:transparent; border:1px solid rgba(165,255,214,.43); cursor:pointer; transition:background .14s,transform .14s; }
    .help:hover,.help:focus-visible { background:rgba(165,255,214,.1); outline:1px solid var(--mint); outline-offset:2px; } .help:active { transform:scale(.97); }
    .guide { position:absolute; inset:0; z-index:8; display:none; place-items:center; padding:20px; background:rgba(2,7,12,.74); backdrop-filter:blur(4px); }
    .guide.open { display:grid; }
    .guide-box { width:min(550px,100%); padding:26px; background:#09131e; border:1px solid var(--line); box-shadow:0 24px 60px rgba(0,0,0,.5); }
    .guide-top { display:flex; align-items:start; justify-content:space-between; gap:16px; }
    .guide h2 { margin:0; color:var(--mint); font-size:19px; }
    .close { color:var(--mist); background:transparent; border:0; font-size:19px; cursor:pointer; }
    .guide p { color:rgba(233,255,245,.71); font-size:11px; line-height:1.8; }
    .key-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin:17px 0; }
    .key-item { display:flex; align-items:center; justify-content:space-between; padding:10px; border:1px solid rgba(165,255,214,.16); color:rgba(233,255,245,.77); font-size:10px; }
    kbd { color:var(--mint); border:1px solid rgba(165,255,214,.4); padding:2px 5px; font:inherit; background:rgba(165,255,214,.06); }
    @keyframes pulse { 0%,100%{opacity:.48;transform:scale(.86)} 50%{opacity:1;transform:scale(1)} }
    @media (max-width:600px){ .shell{padding:0}.console{min-height:100svh;border-width:0}.deck{min-height:58px}.status{display:none}.viewport{min-height:0;aspect-ratio:auto;height:calc(100svh - 115px)}.footer{font-size:9px}.key-grid{grid-template-columns:1fr}.mark{width:33px;height:33px} }
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
  </style>
</head>

        if (!this.context || this.context.state !== 'running') return;
        const now = this.context.currentTime; if (this.last[name] && now - this.last[name] < duration*.38) return; this.last[name] = now;
        const osc = this.context.createOscillator(), gain = this.context.createGain(); osc.type=type; osc.frequency.setValueAtTime(frequency,now); osc.frequency.exponentialRampToValueAtTime(Math.max(24,frequency+drift),now+duration); gain.gain.setValueAtTime(.0001,now); gain.gain.exponentialRampToValueAtTime(volume,now+.012); gain.gain.exponentialRampToValueAtTime(.0001,now+duration); osc.connect(gain).connect(this.context.destination); osc.start(now); osc.stop(now+duration+.02);
      }
      play(name) { const originalName={thrust:'thrust',beat1:'beat1',beat2:'beat2',saucer:'saucerBig'}[name]; if (originalName && this.playOriginal(originalName)) return; const tones={thrust:[74,.08,'sawtooth',.025,25],fire:[780,.10,'square',.055,-510],beat1:[114,.11,'sine',.06,-20],beat2:[92,.11,'sine',.06,-12],bang:[170,.2,'sawtooth',.055,-130],saucer:[270,.18,'triangle',.038,70],warp:[440,.22,'sine',.05,360],life:[540,.32,'sine',.05,240]}; const t=tones[name]; if(t)this.tone(name,...t); }
    }

    class Game {
      constructor() {
        this.input = new InputManager(); this.audio = new AudioBank(); this.bg = new Image(); this.bg.src = BACKGROUND_URL;
        this.w = 960; this.h = 540; this.dpr = 1; this.lastTime = performance.now(); this.mode = 'title'; this.score = 0; this.highScore = Number(localStorage.getItem('astr79-high-score') || 0); this.lives = 3; this.wave = 1; this.entities = {}; this.stars = []; this.beatClock = 0; this.beatIndex = 0; this.saucerTimer = 9; this.nextLife = 10000; this.demo = new URLSearchParams(location.search).has('demo'); this.resize(); this.makeStars(); this.makeAttract(); this.loop = this.loop.bind(this); requestAnimationFrame(this.loop); if(this.demo){setTimeout(()=>this.start(),240);}
      }
      resize() { const rect=canvas.getBoundingClientRect(); this.w=Math.max(320,rect.width); this.h=Math.max(240,rect.height); this.dpr=Math.min(window.devicePixelRatio||1,2); canvas.width=Math.round(this.w*this.dpr); canvas.height=Math.round(this.h*this.dpr); ctx.setTransform(this.dpr,0,0,this.dpr,0,0); }
      makeStars(){ this.stars=Array.from({length:Math.round(this.w*this.h/5600)},()=>({x:Math.random()*this.w,y:Math.random()*this.h,r:Math.random()>.87?1.2:.55,a:rand(.22,.86),d:rand(.3,1.1)})); }
      makeAttract(){ this.attract=Array.from({length:4},(_,i)=>this.createAsteroid(i%3, rand(90,this.w-90),rand(90,this.h-90),rand(-18,18),rand(-15,15))); }
      resetEntities(){ this.entities={ship:this.createShip(),asteroids:[],bullets:[],enemyBullets:[],particles:[],saucer:null}; }
      createShip(){ return {x:this.w/2,y:this.h/2,vx:0,vy:0,angle:-Math.PI/2,radius:13,rotationSpeed:4.2,fireCooldown:0,warpCooldown:0,invulnerable:2.3,thrusting:false,alive:true}; }
      createAsteroid(size,x,y,vx,vy){ const radii=[13,25,48], count=[7,9,11][size]; const pts=[]; for(let i=0;i<count;i++){ const angle=(i/count)*Math.PI*2; pts.push({angle,ratio:rand(.66,1.13)}); } return {size,x,y,vx:vx??rand(-42,42),vy:vy??rand(-42,42),radius:radii[size],angle:rand(0,6.28),spin:rand(-.75,.75),points:pts}; }
      spawnWave(){ const count=Math.min(3+this.wave,9); for(let i=0;i<count;i++){ let x,y,tries=0; do{x=rand(0,this.w);y=rand(0,this.h);tries++;}while(Math.hypot(x-this.w/2,y-this.h/2)<Math.min(this.w,this.h)*.24&&tries<20); this.entities.asteroids.push(this.createAsteroid(2,x,y)); } this.entities.ship.invulnerable=2.2; this.saucerTimer=clamp(11-this.wave*.6,4,10); }
      start(){ this.audio.unlock(); this.mode='playing'; this.score=0;this.lives=3;this.wave=1;this.nextLife=10000;this.beatClock=0;this.beatIndex=0;this.resetEntities();this.spawnWave(); overlay.classList.add('hidden'); systemState.textContent='系統 // 攔截執行'; canvas.focus({preventScroll:true}); }
      pause(){ if(this.mode==='playing'){this.mode='paused';this.showOverlay('航線<br>凍結','航線已凍結。按 <strong>P</strong>、<strong>ESC</strong> 或按鈕恢復。','恢復攔截航線');systemState.textContent='系統 // 暫停';} else if(this.mode==='paused'){this.mode='playing';overlay.classList.add('hidden');systemState.textContent='系統 // 攔截執行';} }
      showOverlay(title,text,button){ overlayTitle.innerHTML=title; overlayText.innerHTML=text; startButton.textContent=button; overlay.classList.remove('hidden'); }
      gameOver(){ this.mode='gameover'; this.highScore=Math.max(this.highScore,this.score); localStorage.setItem('astr79-high-score',String(this.highScore)); this.showOverlay('訊號<br>中斷',`最終讀數：<strong>${this.score.toString().padStart(6,'0')}</strong><br>本機最高分：<strong>${this.highScore.toString().padStart(6,'0')}</strong>`,'按 ENTER 重新部署'); systemState.textContent='系統 // 訊號中斷'; this.audio.play('bang'); }
      loop(now){ const raw=(now-this.lastTime)/1000; this.lastTime=now; const dt=Math.min(raw,.05); if(this.mode==='playing')this.update(dt); else if(this.mode==='title')this.updateAttract(dt); this.render(); requestAnimationFrame(this.loop); }
      updateAttract(dt){ for(const a of this.attract){a.x=wrap(a.x+a.vx*dt,this.w);a.y=wrap(a.y+a.vy*dt,this.h);a.angle+=a.spin*dt;} }
      update(dt){ const e=this.entities,ship=e.ship; if(this.demo) this.applyDemo(dt); this.updateShip(ship,dt); this.updateAsteroids(dt); this.updateBullets(e.bullets,dt); this.updateBullets(e.enemyBullets,dt); this.updateParticles(dt); this.updateSaucer(dt); this.collisions(); this.beatClock-=dt; if(this.beatClock<=0){this.audio.play(this.beatIndex++%2?'beat1':'beat2');this.beatClock=clamp(.92-this.wave*.035,.34,.92);} if(!e.asteroids.length){this.wave++;this.spawnWave();this.audio.play('life');} }
      applyDemo(dt){ const i=this.input; i.down.clear(); if(Math.sin(performance.now()/750)>-.4)i.down.add('ArrowUp'); if(Math.sin(performance.now()/890)>0)i.down.add('ArrowRight'); else i.down.add('ArrowLeft'); if(Math.sin(performance.now()/230)>-.1)i.down.add('Space'); if(Math.random()<dt*.015)i.pressed.add('KeyH'); }
      updateShip(s,dt){ if(!s.alive)return; const i=this.input, left=i.held('ArrowLeft','KeyA'),right=i.held('ArrowRight','KeyD'),thrust=i.held('ArrowUp','KeyW'); if(left)s.angle-=s.rotationSpeed*dt;if(right)s.angle+=s.rotationSpeed*dt;s.thrusting=thrust;if(thrust){s.vx+=Math.cos(s.angle)*220*dt;s.vy+=Math.sin(s.angle)*220*dt;this.audio.play('thrust');} const speed=Math.hypot(s.vx,s.vy),limit=300;if(speed>limit){s.vx=s.vx/speed*limit;s.vy=s.vy/speed*limit;} s.vx*=Math.pow(.992,dt*60);s.vy*=Math.pow(.992,dt*60);s.x=wrap(s.x+s.vx*dt,this.w);s.y=wrap(s.y+s.vy*dt,this.h);s.fireCooldown-=dt;s.warpCooldown-=dt;s.invulnerable=Math.max(0,s.invulnerable-dt);if(i.held('Space')&&s.fireCooldown<=0){this.fireBullet(s,'player');s.fireCooldown=.205;}if(i.take('KeyH')&&s.warpCooldown<=0){this.warpShip(s);} }
      fireBullet(owner,kind){ const source=owner==='player'?this.entities.bullets:this.entities.enemyBullets; if(source.length>6)return; const speed=owner==='player'?470:240;source.push({x:kind.x+Math.cos(kind.angle)*(kind.radius+4),y:kind.y+Math.sin(kind.angle)*(kind.radius+4),vx:kind.vx+Math.cos(kind.angle)*speed,vy:kind.vy+Math.sin(kind.angle)*speed,life:owner==='player'?1.15:1.8,owner});this.audio.play(owner==='player'?'fire':'saucer'); }
      warpShip(s){ s.warpCooldown=1.6;this.audio.play('warp');this.burst(s.x,s.y,COLORS.mint,15,.8);s.x=rand(0,this.w);s.y=rand(0,this.h);s.vx*=.3;s.vy*=.3;s.invulnerable=.45;if(Math.random()<.09)setTimeout(()=>{if(this.mode==='playing'&&this.entities.ship===s)this.destroyShip();},160); }
      updateAsteroids(dt){ for(const a of this.entities.asteroids){a.x=wrap(a.x+a.vx*dt,this.w);a.y=wrap(a.y+a.vy*dt,this.h);a.angle+=a.spin*dt;} }
      updateBullets(list,dt){ for(let i=list.length-1;i>=0;i--){const b=list[i];b.x=wrap(b.x+b.vx*dt,this.w);b.y=wrap(b.y+b.vy*dt,this.h);if((b.life-=dt)<=0)list.splice(i,1);} }
      updateParticles(dt){ const p=this.entities.particles;for(let i=p.length-1;i>=0;i--){const q=p[i];q.x=wrap(q.x+q.vx*dt,this.w);q.y=wrap(q.y+q.vy*dt,this.h);q.vx*=Math.pow(.965,dt*60);q.vy*=Math.pow(.965,dt*60);if((q.life-=dt)<=0)p.splice(i,1);} }
      updateSaucer(dt){ const e=this.entities,s=e.saucer;if(!s){this.saucerTimer-=dt;if(this.saucerTimer<=0){const small=this.wave>2&&Math.random()<.42,fromLeft=Math.random()>.5;e.saucer={x:fromLeft?-30:this.w+30,y:rand(this.h*.15,this.h*.78),vx:fromLeft?rand(46,74):rand(-74,-46),vy:rand(-20,20),angle:fromLeft?0:Math.PI,radius:small?12:18,small,fireCooldown:rand(1.1,2.2),life:15};this.audio.play('saucer');}return;}s.x+=s.vx*dt;s.y=wrap(s.y+s.vy*dt,this.h);s.vy+=rand(-16,16)*dt;s.vy=clamp(s.vy,-36,36);s.fireCooldown-=dt;s.life-=dt;if(s.fireCooldown<=0){const ship=e.ship;const aim=Math.atan2(this.delta(s.y,ship.y,this.h),this.delta(s.x,ship.x,this.w));s.angle=s.small?aim:aim+rand(-.48,.48);this.fireBullet('enemy',s);s.fireCooldown=s.small?rand(.85,1.5):rand(1.4,2.3);}if(s.life<=0||s.x<-45||s.x>this.w+45){e.saucer=null;this.saucerTimer=clamp(rand(9,15)-this.wave*.45,4,13);} }
      delta(a,b,max){let d=a-b;if(d>max/2)d-=max;if(d<-max/2)d+=max;return d;}
      distance(a,b){return Math.hypot(this.delta(a.x,b.x,this.w),this.delta(a.y,b.y,this.h));}
      collisions(){ const e=this.entities; for(let i=e.bullets.length-1;i>=0;i--){const b=e.bullets[i];let hit=false;for(let j=e.asteroids.length-1;j>=0;j--){const a=e.asteroids[j];if(this.distance(a,b)<a.radius+3){e.bullets.splice(i,1);this.breakAsteroid(j);hit=true;break;}}if(!hit&&e.saucer&&this.distance(e.saucer,b)<e.saucer.radius+3){e.bullets.splice(i,1);this.score+=e.saucer.small?1000:200;this.burst(e.saucer.x,e.saucer.y,COLORS.coral,20,.8);e.saucer=null;this.audio.play('bang');}}
        const ship=e.ship;if(ship.alive&&ship.invulnerable<=0){for(const a of e.asteroids){if(this.distance(a,ship)<a.radius+ship.radius*.78){this.destroyShip();break;}}if(e.saucer&&this.distance(e.saucer,ship)<e.saucer.radius+ship.radius){this.destroyShip();}for(const b of e.enemyBullets){if(this.distance(b,ship)<ship.radius+4){this.destroyShip();break;}}} }
      breakAsteroid(index){ const e=this.entities,a=e.asteroids[index];e.asteroids.splice(index,1);this.score+=[100,50,20][a.size];this.burst(a.x,a.y,a.size===0?COLORS.amber:COLORS.mint,13+a.size*6,.72);this.audio.play('bang');if(this.score>=this.nextLife){this.lives++;this.nextLife+=10000;this.audio.play('life');}if(a.size>0){for(const sign of [-1,1]){const angle=Math.atan2(a.vy,a.vx)+sign*rand(.7,1.5);const speed=Math.hypot(a.vx,a.vy)+rand(22,58);e.asteroids.push(this.createAsteroid(a.size-1,a.x,a.y,Math.cos(angle)*speed,Math.sin(angle)*speed));}} }
      burst(x,y,color,count,life){ for(let i=0;i<count;i++){const a=rand(0,Math.PI*2),s=rand(38,205);this.entities.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(life*.45,life),maxLife:life,color});} }
      destroyShip(){ const s=this.entities.ship;if(!s.alive||s.invulnerable>0)return;s.alive=false;this.burst(s.x,s.y,COLORS.coral,34,1);this.audio.play('bang');this.lives--;if(this.lives<0){this.gameOver();return;}setTimeout(()=>{if(this.mode==='playing'){this.entities.ship=this.createShip();this.entities.ship.invulnerable=2.7;this.entities.ship.x=this.w/2;this.entities.ship.y=this.h/2;this.audio.play('life');}},1150); }
      line(color,width=1.25,glow=0){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.shadowColor=color;ctx.shadowBlur=glow;}
      render(){ ctx.clearRect(0,0,this.w,this.h);ctx.fillStyle=COLORS.ink;ctx.fillRect(0,0,this.w,this.h);if(this.bg.complete&&this.bg.naturalWidth){ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=.055;ctx.drawImage(this.bg,0,0,this.w,this.h);ctx.restore();}this.drawStars();if(this.mode==='title'){for(const a of this.attract)this.drawAsteroid(a);this.drawAttractShip();this.drawHUD();return;} const e=this.entities;for(const a of e.asteroids)this.drawAsteroid(a);for(const p of e.particles)this.drawParticle(p);for(const b of e.bullets)this.drawBullet(b,COLORS.mist);for(const b of e.enemyBullets)this.drawBullet(b,COLORS.coral);if(e.saucer)this.drawSaucer(e.saucer);if(e.ship.alive)this.drawShip(e.ship);this.drawHUD();if(this.mode==='paused'){ctx.fillStyle='rgba(2,7,12,.5)';ctx.fillRect(0,0,this.w,this.h);} }
      drawStars(){for(const s of this.stars){ctx.fillStyle=`rgba(233,255,245,${s.a*.82})`;ctx.fillRect(s.x,s.y,s.r,s.r);}}
      drawAttractShip(){const ship={x:this.w/2,y:this.h*.64,angle:-Math.PI/2,thrusting:true,invulnerable:0};this.drawShip(ship);}
      drawAsteroid(a){ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.angle);ctx.beginPath();a.points.forEach((p,i)=>{const r=a.radius*p.ratio,x=Math.cos(p.angle)*r,y=Math.sin(p.angle)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.closePath();this.line(COLORS.mint,1.35,7);ctx.stroke();ctx.restore();}
      drawShip(s){if(s.invulnerable>0&&Math.floor(s.invulnerable*11)%2===0)return;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.angle);if(s.thrusting){ctx.beginPath();ctx.moveTo(-10,-7);ctx.lineTo(-25,0);ctx.lineTo(-10,7);this.line(COLORS.amber,1.5,11);ctx.stroke();}ctx.beginPath();ctx.moveTo(17,0);ctx.lineTo(-11,-10);ctx.lineTo(-6,0);ctx.lineTo(-11,10);ctx.closePath();this.line(COLORS.mint,1.55,10);ctx.stroke();ctx.restore();}
      drawSaucer(s){ctx.save();ctx.translate(s.x,s.y);ctx.beginPath();ctx.ellipse(0,3,s.radius,5.5,0,0,Math.PI*2);ctx.moveTo(-s.radius*.68,2);ctx.quadraticCurveTo(0,-s.radius*.75,s.radius*.68,2);this.line(s.small?COLORS.coral:COLORS.amber,1.35,9);ctx.stroke();ctx.restore();}
      drawBullet(b,color){const len=6,ang=Math.atan2(b.vy,b.vx);ctx.beginPath();ctx.moveTo(b.x-Math.cos(ang)*len,b.y-Math.sin(ang)*len);ctx.lineTo(b.x+Math.cos(ang)*len,b.y+Math.sin(ang)*len);this.line(color,1.35,8);ctx.stroke();}
      drawParticle(p){ctx.globalAlpha=clamp(p.life/p.maxLife,0,1);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.024,p.y-p.vy*.024);this.line(p.color,1.1,6);ctx.stroke();ctx.globalAlpha=1;}
      drawHUD(){ const pad=clamp(this.w*.026,14,30),small=clamp(this.w*.013,11,15),main=clamp(this.w*.024,16,25);ctx.save();ctx.fillStyle='rgba(3,10,17,.74)';ctx.fillRect(pad-7,pad-7,155,small+main+38);ctx.fillRect(this.w-pad-142,pad-7,149,small*2+38);ctx.strokeStyle='rgba(165,255,214,.16)';ctx.lineWidth=1;ctx.strokeRect(pad-7,pad-7,155,small+main+38);ctx.strokeRect(this.w-pad-142,pad-7,149,small*2+38);ctx.font=`${small}px "Courier New", monospace`;ctx.textBaseline='top';ctx.fillStyle='rgba(165,255,214,.75)';ctx.fillText('分數',pad,pad);ctx.font=`bold ${main}px "Courier New", monospace`;ctx.fillStyle=COLORS.mint;ctx.shadowColor=COLORS.mint;ctx.shadowBlur=12;ctx.fillText(this.score.toString().padStart(6,'0'),pad,pad+small+4);ctx.shadowBlur=0;ctx.font=`${small}px "Courier New", monospace`;ctx.fillStyle=COLORS.dim;ctx.fillText('最高 '+this.highScore.toString().padStart(6,'0'),pad,pad+small+main+12);const wave='波次 // '+String(this.wave).padStart(2,'0');ctx.textAlign='right';ctx.fillStyle=COLORS.mint;ctx.font=`bold ${small}px "Courier New", monospace`;ctx.fillText(wave,this.w-pad,pad);ctx.fillStyle='rgba(165,255,214,.75)';ctx.fillText('生命',this.w-pad,pad+small+6);for(let i=0;i<Math.max(0,this.lives);i++){const x=this.w-pad-i*22,y=pad+small*2+15;ctx.save();ctx.translate(x,y);ctx.rotate(-Math.PI/2);ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(-5,-4);ctx.lineTo(-3,0);ctx.lineTo(-5,4);ctx.closePath();this.line(COLORS.mint,1.1,5);ctx.stroke();ctx.restore();}ctx.textAlign='left';ctx.fillStyle='rgba(233,255,245,.58)';ctx.font=`${Math.max(9,small-2)}px "Courier New", monospace`;ctx.fillText(this.mode==='paused'?'航線凍結 // P 以恢復':'P：暫停 · H：超空間跳躍',pad,this.h-pad-small);ctx.restore();}
    }
    const game = new Game();
    const blocked=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'];
    addEventListener('keydown',e=>{if(blocked.includes(e.code))e.preventDefault();if(e.code==='Enter'&&(game.mode==='title'||game.mode==='gameover')){game.start();return;}if(['KeyP','Escape'].includes(e.code)){if(game.mode==='playing'||game.mode==='paused')game.pause();return;}if(e.code==='Slash'){toggleGuide();return;}game.input.update(e.code,true);if(game.mode==='title')game.audio.unlock();});
    addEventListener('keyup',e=>game.input.update(e.code,false));
    addEventListener('blur',()=>{game.input.clear();if(game.mode==='playing')game.pause();});
    addEventListener('resize',()=>{game.resize();game.makeStars();});
    startButton.addEventListener('click',()=>{if(game.mode==='paused')game.pause();else game.start();});
    canvas.addEventListener('pointerdown',()=>{game.audio.unlock();canvas.focus({preventScroll:true});if(game.mode==='title'||game.mode==='gameover')game.start();});
    const guide=$('guide');function toggleGuide(){guide.classList.toggle('open');if(guide.classList.contains('open')&&game.mode==='playing')game.pause();} $('helpButton').addEventListener('click',toggleGuide);$('closeGuide').addEventListener('click',()=>guide.classList.remove('open'));
  })();
  </script>
