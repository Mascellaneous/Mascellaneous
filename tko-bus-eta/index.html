<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="巴士到站時間，實時查詢九巴班次。" />
  <title>巴士到站時間</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 頂部導航列 -->
  <header class="topbar">
    <div class="topbar-logo">
      <div class="topbar-logo-icon">🚌</div>
      <span class="topbar-title">巴士到站時間</span>
    </div>
    <button id="btn-refresh" class="btn-refresh" title="更新所有到站時間" aria-label="更新所有到站時間">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
      更新
    </button>
  </header>

  <!-- Tab 切換列 -->
  <nav class="tab-bar" role="tablist">
    <button class="tab-btn active" id="tab-out" role="tab" aria-selected="true"  aria-controls="panel-out"  data-tab="out">
      <span class="tab-icon">🏠</span> 出街
    </button>
    <button class="tab-btn"        id="tab-home" role="tab" aria-selected="false" aria-controls="panel-home" data-tab="home">
      <span class="tab-icon">🔙</span> 回家
    </button>
    <span class="tab-gps-status" id="gps-status" title="GPS 狀態"></span>
  </nav>

  <!-- 主體 -->
  <main>

    <!-- 出街 Tab 面板 -->
    <section id="panel-out" class="tab-panel active" role="tabpanel" aria-labelledby="tab-out">
      <div class="cards-grid" id="grid-out" role="list"></div>
      <p class="empty-msg" id="empty-out" hidden>未有設定出街路線，請在 config.js 的 OUT_ROUTES 加入路線。</p>
    </section>

    <!-- 回家 Tab 面板 -->
    <section id="panel-home" class="tab-panel" role="tabpanel" aria-labelledby="tab-home">
      <div class="cards-grid" id="grid-home" role="list"></div>
      <p class="empty-msg" id="empty-home" hidden>未有設定回家路線，請在 config.js 的 HOME_ROUTES 加入路線。</p>
    </section>

    <p class="update-time" id="update-time"></p>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
