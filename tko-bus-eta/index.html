<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="將軍澳富寧花園及將軍澳醫院巴士到站時間，實時查詢九巴班次。" />
  <title>將軍澳巴士到站時間</title>

  <!-- Google Fonts: Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 頂部導航列 -->
  <header class="topbar">
    <a class="topbar-logo" href="#cards-grid" aria-label="直接前往巴士班次">
      <div class="topbar-logo-icon">巴</div>
      <span class="topbar-title">將軍澳巴士到站時間</span>
    </a>
    <button
      id="btn-refresh"
      class="btn-refresh"
      title="更新所有到站時間"
      aria-label="更新所有到站時間"
    >
      <!-- 更新圖示 (SVG) -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
      更新
    </button>
  </header>

  <!-- 主體 -->
  <main>
    <h1 class="section-title" id="cards-grid-label">巴士到站時間</h1>
    <div class="cards-grid" id="cards-grid" role="list" aria-labelledby="cards-grid-label"></div>
    <p class="update-time" id="update-time"></p>
  </main>

  <!-- 設定檔（路線資料）— 先載入，供 app.js 使用 -->
  <script src="config.js"></script>
  <!-- 主邏輯 -->
  <script src="app.js"></script>

</body>
</html>
